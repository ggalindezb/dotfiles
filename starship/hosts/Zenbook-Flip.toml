# Starship prompt for the Zenbook Flip S
#
# Linked to ~/.config/starship.toml by the installer when the hostname matches.
# Same palette and pixelated edges as the tmux bar. tmux already shows the full
# path, branch and clock, so this sticks to what it doesn't: repo state,
# runtimes, slow commands and failures.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'carabina'

format = """
[](fg:apricot)\
$directory\
[](fg:apricot bg:block)\
$git_branch\
$git_status\
[](fg:block bg:dim)\
$nodejs\
$python\
$rust\
[](fg:dim)\
$cmd_duration
$character"""

[palettes.carabina]
apricot = '#f8c291'
block = '#444444'
dim = '#303030'
ink = '#000000'
grey = '#949494'
yellow = '#ffd75f'   # colour221
green = '#afd700'    # colour148
lilac = '#d7afff'    # colour183
salmon = '#ffaf87'   # colour216
red = '#d75f5f'

[directory]
style = 'fg:ink bg:apricot'
read_only_style = 'fg:red bg:apricot'
format = '[ $path ]($style)[$read_only]($read_only_style)'
read_only = ' '
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
symbol = ' '
style = 'fg:yellow bg:block'
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'fg:salmon bg:block'
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ' '
style = 'fg:green bg:dim'
format = '[ $symbol($version) ]($style)'

[python]
symbol = ' '
style = 'fg:yellow bg:dim'
format = '[ $symbol($version)( \($virtualenv\)) ]($style)'

[rust]
symbol = ' '
style = 'fg:salmon bg:dim'
format = '[ $symbol($version) ]($style)'

[cmd_duration]
min_time = 2_000
style = 'fg:grey'
format = '[  $duration]($style)'

[character]
success_symbol = '[❯](bold fg:apricot)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:lilac)'
