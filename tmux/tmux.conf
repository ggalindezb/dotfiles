# Tmux configuration file
#
# Maintainer:	Gerardo Galindez
# Created:          2019/05/15
# Last Updated:     2026/10/23
# File Location:    ~/.tmux.conf
# Sections:
#    -> General                    [GEN]
#    -> Plugins                    [PLG]
#    -> Interface                  [INT]
#    -> Keymaps                    [KEY]
#    -> References                 [REF]
#    -> Stash                      [STH]

#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> General [GEN]
#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
set-option -g default-shell /usr/bin/fish               # Set default to fish
set-option -g default-terminal "tmux-256color"          # Set $TERM
set-option -as terminal-features ',xterm-ghostty:usstyle:sync:hyperlinks' # Undercurl, sync, links
set-option -s escape-time 10                            # Short wait for Esc-sequence
set-option -g base-index 1                              # Indexes starts at 1
setw -g pane-base-index 1                               # Pane's indexes start to 1
set-option -g renumber-windows on                       # Close index gaps when a window closes
set-option -g focus-events on                           # Pass/request terminal events
set -g mouse on                                         # Allow mouse scrollback
set-option -g history-limit 100000                      # Proper scrollback
setw -g mode-keys vi                                    # Vi keys in copy mode

#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> Plugin [PLG]
#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# Prefix + I to install, Prefix + U to update
# # Startup tmux plugins
if "test ! -d ~/.tmux/plugins/tpm" \
     "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @prefix_highlight_fg '#303030'
set -g @prefix_highlight_bg '#e3d454'

# set -g @plugin 'tmux-plugins/tmux-battery'

#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> Interface [INT]
#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> Status bar
set-option -g status-style fg=white,bg='#303030'   # Carabina 30-30
set-option -g status-left '  #S #{prefix_highlight}#[fg=#f8c291,bg=#303030]#[default]'
set-option -g status-left-length 30
set-option -g status-left-style fg='#000000',bg='#f8c291'
set-option -g status-right '#[fg=#444444,bg=#303030]#[bg=#444444]#[fg=colour216]  #{=/-20/…;s|^/home/[^/]+|~|:pane_current_path}#[fg=#949494]#(cd "#{pane_current_path}" && set -- $(git --no-optional-locks rev-parse --path-format=absolute --git-dir --git-common-dir 2>/dev/null) && [ "$1" != "$2" ] && echo " ")#[fg=colour183]#(cd "#{pane_current_path}" && set -- $(git --no-optional-locks rev-parse --path-format=absolute --git-dir --git-common-dir 2>/dev/null) && [ "$1" != "$2" ] && t=$(git --no-optional-locks rev-parse --show-toplevel) && n=$(basename "$t") && { [ ${#n} -le 20 ] || n="$(echo "$n" | cut -c1-19)…"; } && echo " 󰙅 $n")#[fg=#949494]#(cd "#{pane_current_path}" && [ -n "$(git --no-optional-locks branch --show-current 2>/dev/null)" ] && echo " ")#[fg=colour221]#(cd "#{pane_current_path}" && b=$(git --no-optional-locks branch --show-current 2>/dev/null) && [ -n "$b" ] && { git --no-optional-locks diff-index --quiet HEAD -- 2>/dev/null || m=" *"; } && { [ ${#b} -le 20 ] || b="$(echo "$b" | cut -c1-19)…"; } && echo "  $b$m") #[fg=#949494]#[fg=colour148] %H:%M #[fg=#4e4e4e,bg=#444444]#[bg=#4e4e4e]#[fg=#d75f5f]  #{user}@#h #[default]'
set-option -g status-interval 5
set-option -g status-right-length 100
set-option -g window-status-format         " #(~/.config/tmux/dir-icon.sh \"#{pane_current_path}\") #I:#W#F #{?#{||:#{window_end_flag},#{==:#{e|+|:#{window_index},1},#{active_window_index}}},,#[fg=#585858]#[default]}"
set-option -g window-status-current-format "#[fg=#4e4e4e,bg=#303030]#[fg=#ffffff,bg=#4e4e4e] #(~/.config/tmux/dir-icon.sh \"#{pane_current_path}\") #I:#W#F #[fg=#4e4e4e,bg=#303030]#[default]"
set-option -g window-status-separator ''
set-option -g status-keys vi

# -> Panes
set-option -g pane-active-border-style fg='#585858'
set-option -g pane-border-style fg='#585858'

# -> Notifications
set-option -g activity-action any
setw -g monitor-activity off
set-option -g window-status-activity-style fg=green,bright
set-option -g message-style fg='black',bg='#F5DA81'
set -g display-time 2500

# Feedback
set -g visual-activity off
set -g visual-bell on
set -g visual-silence on
set -g bell-action any

#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> Keymaps [KEY]
#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# ====================
# -> Resets
# ====================
unbind C-b                          # Prefix
unbind '"'                          # Vertical pane
unbind C-s
unbind %                            # Horizontal pane
unbind C-v

# Use C-s for prefix
set-option -g prefix C-s

# Reload config file
bind R source-file ~/.tmux.conf \; display-message "source-file done"

# Vim-style splits
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"

# Vim-style window flow
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Meta + arrows for pane switching
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Use Meta + number for window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> References [REF]
#""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""""
# -> The Tao of Tmux [https://leanpub.com/the-tao-of-tmux]
# -> Ham Vocke [https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/]

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
